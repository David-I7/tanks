spring.application.name=server
logging.level.org.springframework.security=INFO
logging.level.com.tanks.server=DEBUG
spring.profiles.active=local
spring.config.import=file:.env[.properties],file:.env.database[.properties]

##############################
#          POSTGRES          #
##############################

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true

###########################
#       APPLICATION       #
###########################

spring.mvc.problemdetails.enabled=true
app.isDev=${APP_ISDEV}
app.client.origin=${APP_CLIENT_ORIGIN}
