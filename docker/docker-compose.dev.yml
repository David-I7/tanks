name: tanks-dev
services:
  tanks:
    build:
      context: ../server
      dockerfile: Dockerfile
      target: dev
    container_name: tanks
    volumes:
      - type: bind
        source: ../server
        target: /app
      - type: volume
        target: /root/.m2
      - type: volume
        target: /app/target
    networks:
      - backend

  react-client:
    build:
      context: ../client
      dockerfile: Dockerfile.dev
      target: dev
    container_name: react-client
    volumes:
      - type: bind
        source: ../client
        target: /app
      - type: volume
        target: /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - frontend
  nginx:
    depends_on:
      - tanks
    build:
      context: ../client
      dockerfile: Dockerfile.dev
      target: nginx
    container_name: nginx
    ports:
      - "8080:8080"
    networks:
      - frontend
      - backend

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
