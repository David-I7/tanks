server{
    listen 8080;
    server_name tanks.com;
    
    return 301 http://$host$request_uri;
}

server{
    listen 8443 ssl;
    server_name tanks.com;

    ssl_certificate /etc/nginx/ssl/tanks.com.crt;
    ssl_certificate_key /etc/nginx/ssl/tanks.com.key;

    #Docker internal dns server
    resolver 127.0.0.1;

    location /api/v1/ {
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        proxy_pass http://tanks:8080;
    }

    location /ws{
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;       
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;                   
        proxy_set_header X-Forwarded-Proto $scheme; 

        # Prevent Nginx from closing idle WebSocket connections (default is 60s)        
        proxy_read_timeout 3600s;              
        proxy_send_timeout 3600s; 

        proxy_pass http://tanks:8080;
    }

    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }
}